# ============================================================================
# FILE: src/main/resources/application.properties
# ============================================================================
# WHY THIS FILE IS NEEDED:
#   Spring Boot applications use application.properties to configure runtime settings 
#   including HTTP port, database connection credentials, Hibernate JPA behavior, 
#   JWT secret tokens, and logging levels.
#
# WHAT THIS FILE DOES:
#   1. Sets server HTTP port to 8080.
#   2. Configures MySQL JDBC connection details (URL, Username, Password).
#   3. Enables Hibernate auto-schema DDL update and SQL query logging.
#   4. Defines JWT secret key and expiration properties.
#   5. Configures Swagger UI endpoint paths.
# ============================================================================

# 1. SERVER CONFIGURATION
server.port=8080
server.servlet.context-path=/api/v1

# 2. SPRING APPLICATION NAME
spring.application.name=tracklytics-backend

# 3. MYSQL DATABASE CONNECTION CONFIGURATION
# JDBC URL automatically creates the database 'tracklytics_db' if it does not exist
spring.datasource.url=jdbc:mysql://localhost:3306/tracklytics_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 4. HIBERNATE & JPA PERSISTENCE SETTINGS
# Automatically creates or updates MySQL database tables matching JPA @Entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# 5. JWT AUTHENTICATION CONFIGURATION
# Secret key used to sign and verify JWT tokens (HMAC SHA-256)
tracklytics.app.jwtSecret=404E635266556A586E3272357538782F413F4428472B4B6250655368566D5971
tracklytics.app.jwtExpirationMs=86400000
tracklytics.app.jwtRefreshExpirationMs=604800000

# 6. SWAGGER / OPENAPI DOCUMENTATION CONFIGURATION
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# 7. LOGGING CONFIGURATION
logging.level.org.springframework.web=INFO
logging.level.com.tracklytics=DEBUG
logging.level.org.hibernate.SQL=DEBUG
